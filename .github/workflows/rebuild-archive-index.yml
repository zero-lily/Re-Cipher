name: Refresh public archive index

on:
  push:
    branches: [main]
    paths:
      - "archive-data/*.json"
      - "!archive-data/index.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipher-archive-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index from chat files
        run: python scripts/rebuild_archive_index.py
      - name: Commit index if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive-data/index.json
          if git diff --cached --quiet; then
            echo "Archive index is up to date."
            exit 0
          fi
          git commit -m "data: refresh archive index"
          git pull --rebase origin main
          git push origin HEAD:main

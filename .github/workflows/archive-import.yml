name: Import YouTube archived chat (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTubeアーカイブURL（または11文字の動画ID）'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: recipher-archive-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Confirm yt-dlp JavaScript runtime
        run: deno --version
      - name: Install yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"
      - name: Import requested archive (may be blocked by YouTube on GitHub-hosted IP)
        env:
          REQUEST_VIDEO: ${{ inputs.video_url }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/import_archive.py --video "$REQUEST_VIDEO"
          else
            echo "::error::Automatic discovery has been paused because GitHub-hosted IPs can be blocked by YouTube. Use manual video URL or local upload."
            exit 1
          fi
      - name: Commit imported chat data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive-data/
          if git diff --cached --quiet; then
            echo "No new archive data."
            exit 0
          fi
          git commit -m "data: update YouTube archive chat replay"
          git pull --rebase origin main
          git push origin HEAD:main

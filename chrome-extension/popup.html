<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Re信号</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <div><h1>Re信号 <span>暗号化・復号</span></h1><p>YouTubeコメント・ライブチャット用</p></div>
    <span class="version">v1.1.2</span>
  </header>
  <label class="toggle" for="enabled"><span><b>自動復号</b><small>コメント・チャットを色付きで復号</small></span><input class="switch" id="enabled" type="checkbox" role="switch"></label>
  <section class="tool" aria-label="暗号化ツール">
    <div class="sectionhead"><h2>暗号化</h2><span id="char-count">0文字</span></div>
    <textarea id="plain" rows="4" spellcheck="false" placeholder="投稿したい文章を入力してください"></textarea>
    <div class="row"><button id="encrypt" class="subtle" type="button">暗号化</button><button id="clear" class="textbutton" type="button">クリア</button></div>
    <div class="output-label"><strong>変換結果</strong><span id="cipher-count">0文字</span></div>
    <div class="result" id="cipher" role="status">暗号化するとここに表示されます</div>
    <div class="row buttons"><button id="copy" type="button" class="subtle" disabled>暗号文をコピー</button><button id="send" type="button" class="primary" disabled>暗号化して送信…</button></div>
    <p class="small-note">送信は2段階確認制です。入力済みの下書きは上書きしません。</p>
  </section>
  <section id="confirm-panel" class="confirm hidden" aria-label="送信の最終確認">
    <h2>送信前の確認</h2>
    <label for="dest">送信先を確認してください</label>
    <select id="dest"></select>
    <div class="preview" id="preview"></div>
    <p id="confirm-warn" class="small-note">内容と送信先が正しい場合のみ確定してください。</p>
    <div class="row"><button id="cancel" type="button" class="subtle">戻る</button><button id="commit" type="button" class="danger" disabled>この内容を送信する</button></div>
  </section>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <details class="settings"><summary>辞書と設定</summary>
    <div id="status">辞書を読み込み中…</div>
    <div id="decode-issue" class="issue hidden">復号できない投稿を検出しました。辞書が古い可能性があります。</div>
    <button id="update" type="button" class="subtle full">GitHubの辞書を確認・更新</button>
    <p class="small-note">Chrome起動時に辞書を確認。更新に失敗しても同梱辞書で動作します。</p>
    <p class="small-note"><a href="https://zero-lily.github.io/Re-Cipher/" target="_blank" rel="noopener noreferrer">暗号化サイトを開く</a></p>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
